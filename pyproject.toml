[project]
name = "sbom-workflows"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = ["pyyaml", "semver"]

[dependency-groups]
dev = ["mypy", "pytest", "types-PyYAML"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["scripts"]

[tool.ruff]
line-length = 120
extend-exclude = [".claude"]

[tool.ruff.lint.isort]
known-first-party = ["image_map"]
