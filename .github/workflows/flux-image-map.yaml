name: Flux image map

# Reusable workflow: renders the calling repo's Flux roots and prints every
# deployed Image with its Controller and Workload as a table.

on:
  workflow_call:
    inputs:
      root:
        description: Flux roots to render, one path per line, relative to the repository root
        type: string
        default: .
      vars:
        description: Substitution variables, one KEY=VALUE per line
        type: string
        default: ""
      kube-version:
        description: Kubernetes version passed to helm template
        type: string
        default: ""
      resolve-digests:
        description: Add a digest column, looked up in each Image's registry
        type: boolean
        default: false
      strict:
        description: Fail on any fallback or warning
        type: boolean
        default: false
    secrets:
      token:
        description: Token for ghcr.io access when resolving digests; defaults to GITHUB_TOKEN
        required: false

jobs:
  map:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          persist-credentials: false
      # Outside repo/, so a root of . doesn't render the tooling.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: sbom-workflows
          persist-credentials: false
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0
      - if: inputs.resolve-digests
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.token || github.token }}
      - name: Map images
        env:
          ROOTS: ${{ inputs.root }}
          VARS: ${{ inputs.vars }}
          KUBE_VERSION: ${{ inputs.kube-version }}
          RESOLVE_DIGESTS: ${{ inputs.resolve-digests }}
          STRICT: ${{ inputs.strict }}
        run: sbom-workflows/scripts/flux-image-map.sh sbom-workflows repo
