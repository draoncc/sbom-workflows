name: SBOM attest all

# Reusable workflow: finds every Platform manifest of the calling repo's GHCR
# Images that lacks an SPDX or CycloneDX SBOM attestation and creates it.

on:
  workflow_call:
    inputs:
      images:
        description: Newline-separated Image names under the owner (e.g. foo, foo/api), each linked to the calling repo; defaults to the repo name
        type: string
        default: ""
      include-untagged:
        description: Also attest untagged image versions
        type: boolean
        default: false
      dry-run:
        description: Only report missing attestations
        type: boolean
        default: false
      max-digests:
        description: Max subject digests attested per run; the rest wait for the next run
        type: number
        default: 256
      max-parallel:
        description: Max concurrent attest jobs
        type: number
        default: 4
      syft-version:
        description: Syft version to generate SBOMs with
        type: string
        default: v1.57.2
    secrets:
      token:
        description: Token with packages access; defaults to GITHUB_TOKEN
        required: false
    outputs:
      missing:
        description: JSON array of {image, digest, spdx, cyclonedx} for subject digests scheduled this run (capped at max-digests)
        value: ${{ jobs.discover.outputs.matrix }}

# Overlapping runs would discover and attest the same subjects twice.
concurrency:
  group: sbom-attest-all-${{ github.repository }}
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      packages: read
      attestations: read
      contents: read
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      count: ${{ steps.discover.outputs.count }}
    steps:
      - name: Find missing attestations
        id: discover
        env:
          GH_TOKEN: ${{ secrets.token || github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          IMAGES: ${{ inputs.images }}
          INCLUDE_UNTAGGED: ${{ inputs.include-untagged }}
          MAX_DIGESTS: ${{ inputs.max-digests }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail

          owner_lc="${OWNER,,}"
          limit=$(( MAX_DIGESTS < 256 ? MAX_DIGESTS : 256 )) # matrix job limit
          owner_type="$(gh api "users/$OWNER" --jq .type)"
          case "$owner_type" in
            Organization) base="orgs/$OWNER" ;;
            *) base="users/$OWNER" ;;
          esac

          spdx_types=(https://spdx.dev/Document/v2.3 https://spdx.dev/Document/v2.2)
          cdx_types=(https://cyclonedx.org/bom)

          err="$(mktemp)"
          has_attestation() { # digest predicate-type...
            local digest="$1" pt n; shift
            for pt in "$@"; do
              if n="$(gh api -X GET "repos/$REPO/attestations/$digest" -f predicate_type="$pt" \
                --jq '.attestations | length' 2>"$err")"; then
                [ "$n" -gt 0 ] && return 0
              elif ! grep -q 'HTTP 404' "$err"; then
                cat "$err" >&2
                exit 1
              fi
            done
            return 1
          }

          accept='application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json'

          # Prints the Platform manifest digests a manifest stands for: its
          # non-unknown children if an Index, itself if an image manifest,
          # nothing for referrers and other artifacts.
          platform_manifests='
            def is_index: .mediaType == "application/vnd.oci.image.index.v1+json"
              or .mediaType == "application/vnd.docker.distribution.manifest.list.v2+json"
              or (.mediaType == null and has("manifests"));
            def is_image_manifest: (.mediaType == "application/vnd.oci.image.manifest.v1+json"
                or .mediaType == "application/vnd.docker.distribution.manifest.v2+json"
                or (.mediaType == null and has("config")))
              and (has("subject") | not)
              and (has("artifactType") | not)
              and (.config.mediaType == "application/vnd.oci.image.config.v1+json"
                or .config.mediaType == "application/vnd.docker.container.image.v1+json");
            if has("subject") then empty
            elif is_index then
              .manifests[]
              | select(.platform != null and .platform.os != "unknown" and .platform.architecture != "unknown")
              | select(.mediaType == "application/vnd.oci.image.manifest.v1+json"
                  or .mediaType == "application/vnd.docker.distribution.manifest.v2+json")
              | .digest
            elif is_image_manifest then $self
            else empty end'

          subjects="$(mktemp)"
          # GITHUB_TOKEN cannot list packages, only look them up by name
          # (docs/adr/0001-name-images-explicitly.md). Named Images must exist
          # and be linked to $REPO, or carry its source label where the link
          # is hidden; the default name may be absent.
          explicit=false; names="${REPO#*/}"
          if [[ "$IMAGES" =~ [^[:space:]] ]]; then explicit=true; names="$IMAGES"; fi
          repo_url="https://github.com/${REPO,,}"
          packages=()
          # The package API hides .repository from GITHUB_TOKEN; such Images
          # are checked per Subject digest by source label instead
          # (docs/adr/0002-check-source-label-when-link-is-hidden.md).
          declare -A link_hidden=() registry_tokens=()
          while read -r name; do
            [ -z "$name" ] && continue
            name="${name,,}"
            case "$name" in
              ghcr.io/*|*:*|*@*)
                echo "::error::images entry '$name' must be a name under $owner_lc, not a reference"
                exit 1 ;;
            esac
            problem=""
            if linked="$(gh api "$base/packages/container/${name//\//%2F}" \
              --jq '.repository.full_name // ""' 2>"$err" </dev/null)"; then
              if [ -z "$linked" ]; then
                link_hidden[$name]=true
              elif [ "${linked,,}" != "${REPO,,}" ]; then
                problem="is linked to '$linked', not $REPO"
              fi
            elif grep -qE 'HTTP (403|404)' "$err"; then
              problem="is not accessible: $(tr '\n' ' ' < "$err")"
            else
              cat "$err" >&2
              exit 1
            fi
            if [ -z "$problem" ]; then
              packages+=("$name")
            elif [ "$explicit" = true ]; then
              echo "::error::image ghcr.io/$owner_lc/$name $problem"
              exit 1
            else
              echo "::warning::image ghcr.io/$owner_lc/$name $problem; skipping"
            fi
          done <<< "$names"
          echo "Found ${#packages[@]} image(s) linked to $REPO" \
            "(${#link_hidden[@]} checked by source label)"

          for pkg in "${packages[@]}"; do
            image="ghcr.io/$owner_lc/$pkg"
            echo "::group::$image"
            if ! registry_token="$(curl -fsS -u "$OWNER:$GH_TOKEN" \
              "https://ghcr.io/token?scope=repository:$owner_lc/$pkg:pull" | jq -er .token)"; then
              echo "::warning::cannot get registry token for $image"
              echo "::endgroup::"
              continue
            fi
            registry_tokens[$pkg]="$registry_token"

            gh api --paginate "$base/packages/container/${pkg//\//%2F}/versions" \
              --jq '.[] | [.name, (.metadata.container.tags | length > 0)] | @tsv' |
            while IFS=$'\t' read -r digest tagged; do
              if [ "$tagged" != true ] && [ "$INCLUDE_UNTAGGED" != true ]; then continue; fi
              if ! manifest="$(curl -fsS -H "Authorization: Bearer $registry_token" -H "Accept: $accept" \
                "https://ghcr.io/v2/$owner_lc/$pkg/manifests/$digest")"; then
                echo "::warning::cannot fetch manifest $image@$digest"
                continue
              fi
              jq -r --arg self "$digest" "$platform_manifests" <<< "$manifest" |
              while read -r subject; do
                printf '%s\t%s\t%s\n' "$image" "$subject" "$tagged"
              done
            done >> "$subjects"
            echo "::endgroup::"
          done

          # Prints a Platform manifest's org.opencontainers.image.source,
          # lowercased without whitespace or a trailing / or .git: its manifest annotation,
          # else its config label, else nothing.
          source_of() { # pkg digest
            local token="${registry_tokens[$1]}" manifest src
            manifest="$(curl -fsS -H "Authorization: Bearer $token" -H "Accept: $accept" \
              "https://ghcr.io/v2/$owner_lc/$1/manifests/$2")" || return 1
            src="$(jq -r '.annotations["org.opencontainers.image.source"] // empty' <<< "$manifest")"
            if [ -z "$src" ]; then
              src="$(curl -fsSL -H "Authorization: Bearer $token" \
                "https://ghcr.io/v2/$owner_lc/$1/blobs/$(jq -r .config.digest <<< "$manifest")" |
                jq -r '.config.Labels["org.opencontainers.image.source"] // empty')" || return 1
            fi
            src="${src//[[:space:]]/}"; src="${src,,}"; src="${src%/}"
            printf '%s\n' "${src%.git}"
          }

          # A Platform manifest reached via several versions is checked once.
          # Workflow commands go to fd 3, since stdout is the missing list.
          exec 3>&1
          missing="$(mktemp)" source_checks="$(mktemp)"
          awk -F'\t' '!seen[$1 FS $2]++' "$subjects" |
          while IFS=$'\t' read -r image subject _; do
            spdx=false; cdx=false
            has_attestation "$subject" "${spdx_types[@]}" || spdx=true
            has_attestation "$subject" "${cdx_types[@]}" || cdx=true
            if [ "$spdx" = false ] && [ "$cdx" = false ]; then continue; fi
            pkg="${image#ghcr.io/"$owner_lc"/}"
            if [ -n "${link_hidden[$pkg]:-}" ]; then
              if ! src="$(source_of "$pkg" "$subject")"; then
                echo "::warning::cannot read source label of $image@$subject; skipping" >&3
                printf '%s\tunreadable\n' "$pkg" >> "$source_checks"
                continue
              fi
              if [ "$src" != "$repo_url" ]; then
                echo "::warning::$image@$subject has source '${src:-none}', not $repo_url; skipping" >&3
                printf '%s\tmismatch\n' "$pkg" >> "$source_checks"
                continue
              fi
              printf '%s\tmatch\n' "$pkg" >> "$source_checks"
            fi
            jq -cn --arg image "$image" --arg digest "$subject" \
              --argjson spdx "$spdx" --argjson cyclonedx "$cdx" \
              '{image: $image, digest: $digest, spdx: $spdx, cyclonedx: $cyclonedx}'
          done > "$missing"

          # A named Image none of whose checked Platform manifests has a source
          # label naming $REPO is treated as linked elsewhere.
          if [ "$explicit" = true ]; then
            unlinked="$(awk -F'\t' '$2 == "match" {ok[$1] = 1} {all[$1] = 1}
              END {for (p in all) if (!(p in ok)) print p}' "$source_checks")"
            if [ -n "$unlinked" ]; then
              while read -r pkg; do
                echo "::error::image ghcr.io/$owner_lc/$pkg has no Platform manifest with source $repo_url"
              done <<< "$unlinked"
              exit 1
            fi
          fi

          total="$(wc -l < "$missing")"
          matrix="$(head -n "$limit" "$missing" | jq -cs .)"
          count="$(jq length <<< "$matrix")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"

          if [ "$DRY_RUN" = true ]; then scheduled="0 scheduled (dry run)"; else scheduled="$count scheduled"; fi
          {
            echo "## Missing SBOM attestations"
            echo
            echo "$total subject digest(s) missing; $scheduled."
            echo
            echo "| Image | Subject digest | SPDX | CycloneDX |"
            echo "| --- | --- | --- | --- |"
            jq -r '.[] | "| \(.image) | `\(.digest)` | \(if .spdx then "missing" else "ok" end) | \(if .cyclonedx then "missing" else "ok" end) |"' <<< "$matrix"
          } >> "$GITHUB_STEP_SUMMARY"

  attest:
    needs: discover
    if: ${{ !inputs.dry-run && needs.discover.outputs.count != '0' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.max-parallel }}
      matrix:
        subject: ${{ fromJSON(needs.discover.outputs.matrix) }}
    name: attest ${{ matrix.subject.image }}@${{ matrix.subject.digest }}
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.token || github.token }}

      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        id: syft
        with:
          syft-version: ${{ inputs.syft-version }}

      - name: Generate SBOMs
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
          SOURCE: registry:${{ matrix.subject.image }}@${{ matrix.subject.digest }}
        run: '"$SYFT" scan "$SOURCE" -o spdx-json=sbom.spdx.json -o cyclonedx-json=sbom.cdx.json'

      - name: Attest SPDX SBOM
        if: ${{ matrix.subject.spdx }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ matrix.subject.image }}
          subject-digest: ${{ matrix.subject.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
          github-token: ${{ secrets.token || github.token }}

      - name: Attest CycloneDX SBOM
        if: ${{ matrix.subject.cyclonedx }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ matrix.subject.image }}
          subject-digest: ${{ matrix.subject.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true
          github-token: ${{ secrets.token || github.token }}
